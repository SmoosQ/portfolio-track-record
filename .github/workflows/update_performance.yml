name: Update Trading Performance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/update_performance.yml"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: performance-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Generate performance report
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python -m src.generate_report

      - name: Verify generated files
        run: |
          test -s reports/normalized_equity_curve.png
          test -s reports/cumulative_pnl_curve.png
          test -s reports/drawdown_curve.png
          test -s reports/daily_returns.png
          test -s reports/monthly_returns.png
          test -s reports/performance_summary.json
          test -s reports/performance_summary.md
          test -s data/processed/normalized_daily_equity.csv

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/processed
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update trading performance"
          git push origin HEAD:${{ github.ref_name }}
